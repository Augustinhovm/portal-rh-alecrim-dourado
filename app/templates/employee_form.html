{% extends 'base.html' %}{% block content %}<h1>Novo colaborador</h1><form method="post" class="panel form-grid"><label>Nome completo<input name="full_name" required></label><label>CPF<input name="cpf" required></label><label>RG<input name="rg"></label><label>Nascimento<input type="date" name="birth_date"></label><label>Telefone<input name="phone"></label><label>Endereço<input name="address"></label><label>E-mail<input type="email" name="email" required></label><label>Senha provisória para primeiro acesso<input type="password" name="password" minlength="8" required placeholder="Mínimo de 8 caracteres"><small>O colaborador será obrigado a criar uma senha pessoal no primeiro login.</small></label><label>Senha de ponto (6 dígitos)<input type="password" name="point_pin" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="Ex.: 482731"><small>Será solicitada em cada registro de ponto.</small></label><label>Matrícula<input name="registration"></label><label>Cargo<input name="job_title" required></label><label>Setor<input name="department" required></label><label>Projeto/Unidade<input name="project" placeholder="Casa Lar / Família Acolhedora / Administração"></label><label>Admissão<input type="date" name="admission_date" required></label><label>Contrato<input name="contract_type" value="CLT"></label><label>Carga semanal<input type="number" step="0.5" name="weekly_hours" value="44"></label><label>Entrada padrão<input type="time" name="standard_start" value="08:00"></label><label>Saída padrão<input type="time" name="standard_end" value="17:00"></label><label>Perfil<select name="role"><option value="employee">Colaborador</option><option value="manager">Responsável</option><option value="admin">RH/Administrador</option></select></label><label>Responsável<select name="manager_id"><option value="">Sem responsável</option>{% for m in managers %}<option value="{{m.id}}">{{m.full_name}}</option>{% endfor %}</select></label><div class="full"><button>Cadastrar colaborador</button></div></form>{% endblock %}
