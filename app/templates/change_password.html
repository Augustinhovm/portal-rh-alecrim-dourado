{% extends 'base.html' %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <h1>Crie sua senha pessoal</h1>
    <p class="muted">Este é o seu primeiro acesso. Para continuar no Portal RH, substitua a senha provisória entregue pelo RH.</p>
    <form method="post">
      <label>Senha provisória
        <input type="password" name="current_password" required autocomplete="current-password">
      </label>
      <label>Nova senha
        <input type="password" name="new_password" minlength="10" required autocomplete="new-password">
      </label>
      <label>Confirmar nova senha
        <input type="password" name="confirm_password" minlength="10" required autocomplete="new-password">
      </label>
      <p class="muted">A nova senha deve ter pelo menos 10 caracteres e ser diferente da senha provisória.</p>
      <button type="submit">Salvar minha nova senha</button>
    </form>
    <form method="post" action="{{ url_for('auth.logout') }}" style="margin-top:12px">
      <button type="submit" class="secondary">Sair</button>
    </form>
  </div>
</div>
{% endblock %}
